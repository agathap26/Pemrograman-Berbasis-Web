
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Stok Bahan Ajar - SITTA</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <header>
        <h1>Informasi Stok Bahan Ajar</h1>
        <p>Universitas Terbuka - Aplikasi SITTA</p>
    </header>

    <main>

        <!-- Bagian tabel informasi bahan ajar -->
        <section>
            <h2>Daftar Stok Bahan Ajar</h2>

            <table border="1" cellpadding="10">
                <thead>
                    <tr>
                        <th>Cover</th>
                        <th>Kode Lokasi</th>
                        <th>Kode Barang</th>
                        <th>Nama Barang</th>
                        <th>Jenis Barang</th>
                        <th>Edisi</th>
                        <th>Stok</th>
                    </tr>
                </thead>

                <!-- Data tabel diisi menggunakan JavaScript DOM -->
                <tbody id="tabelStok"></tbody>
            </table>
        </section>

        <hr>

        <!-- Bagian form untuk menambahkan bahan ajar -->
        <section>
            <h2>Tambah Stok Bahan Ajar Baru</h2>

            <form id="formStok">

                <p>
                    <label for="kodeLokasi">Kode Lokasi:</label>
                    <input type="text" id="kodeLokasi" required>
                </p>

                <p>
                    <label for="kodeBarang">Kode Barang:</label>
                    <input type="text" id="kodeBarang" required>
                </p>

                <p>
                    <label for="namaBarang">Nama Barang:</label>
                    <input type="text" id="namaBarang" required>
                </p>

                <p>
                    <label for="jenisBarang">Jenis Barang:</label>
                    <select id="jenisBarang" required>
                        <option value="BMP">BMP</option>
                        <option value="Non-BMP">Non-BMP</option>
                    </select>
                </p>

                <p>
                    <label for="edisi">Edisi:</label>
                    <input type="number" id="edisi" min="1" required>
                </p>

                <p>
                    <label for="jumlahStok">Jumlah Stok:</label>
                    <input type="number" id="jumlahStok" min="0" required>
                </p>

                <button type="submit">Tambah Bahan Ajar</button>
            </form>
        </section>

        <hr>

        <!-- Navigasi kembali ke dashboard -->
        <p>
            <a href="dashboard.html">Kembali ke Dashboard</a>
        </p>

    </main>

    <!-- Menghubungkan data dosen dan JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/stok.js"></script>

</body>
</html>
