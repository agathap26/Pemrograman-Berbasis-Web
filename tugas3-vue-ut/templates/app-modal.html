<script type="text/x-template" id="tpl-modal">
  <div v-if="open" class="modal-backdrop" @click.self="cancel" role="presentation">
    <div class="modal-panel" role="dialog" aria-modal="true" :aria-label="title">
      <h3 v-text="title"></h3>
      <p v-text="message"></p>
      <div class="actions right">
        <button type="button" class="btn btn-ghost" @click="cancel">Batal</button>
        <button type="button" class="btn btn-danger" @click="confirm">Ya, Hapus</button>
      </div>
    </div>
  </div>
</script>
