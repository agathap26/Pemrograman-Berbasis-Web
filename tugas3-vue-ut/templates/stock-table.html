<script type="text/x-template" id="tpl-stock">
  <div>
    <div class="section-heading">
      <div><h2>Stok Bahan Ajar</h2><p>Kelola data stok untuk seluruh UT-Daerah.</p></div>
      <button type="button" class="btn btn-primary" @click="newItem">+ Tambah Bahan Ajar</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><span>Total judul</span><strong v-text="items.length"></strong></div>
      <div class="stat-card"><span>Stok aman</span><strong v-text="countSafe"></strong></div>
      <div class="stat-card"><span>Stok menipis</span><strong class="orange-text" v-text="countLow"></strong></div>
      <div class="stat-card"><span>Stok kosong</span><strong class="red-text" v-text="countEmpty"></strong></div>
    </div>

    <div class="panel">
      <h3>Filter dan Urutkan Stok</h3>
      <div class="filter-grid">
        <label>Cari kode, judul, atau rak
          <input v-model.trim="search" type="search" placeholder="Contoh: EKMA4116">
        </label>
        <label>UT-Daerah
          <select v-model="area">
            <option value="">Semua UT-Daerah</option>
            <option v-for="upbjj in upbjjList" :key="upbjj" :value="upbjj" v-text="upbjj"></option>
          </select>
        </label>
        <label v-if="area">Kategori Mata Kuliah (dependent option)
          <select v-model="kategori">
            <option value="">Semua kategori</option>
            <option v-for="category in areaCategories" :key="category" :value="category">{{ category }}</option>
          </select>
        </label>
        <label>Urutkan berdasarkan
          <select v-model="sortBy">
            <option value="judul">Judul (A-Z)</option>
            <option value="qty-asc">Stok (terkecil)</option>
            <option value="qty-desc">Stok (terbesar)</option>
            <option value="harga-asc">Harga (termurah)</option>
            <option value="harga-desc">Harga (termahal)</option>
          </select>
        </label>
      </div>
      <div class="filter-bottom">
        <label class="checkline"><input type="checkbox" v-model="onlyNeed"> Hanya stok menipis / kosong (reorder)</label>
        <button type="button" class="btn btn-ghost" @click="resetFilters">Reset Filter</button>
      </div>
    </div>

    <div class="panel table-panel">
      <div class="table-heading"><h3>Daftar Stok</h3><span>{{ filteredItems.length }} dari {{ items.length }} bahan ajar</span></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Kode / Mata Kuliah</th><th>Kategori</th><th>UT-Daerah</th><th>Rak</th>
              <th>Harga</th><th>Stok</th><th>Safety</th><th>Status (arahkan mouse)</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(item, index) in filteredItems" :key="item.kode">
              <td><span class="small-code" v-text="item.kode"></span><br><strong>{{ item.judul }}</strong></td>
              <td>{{ item.kategori }}</td><td>{{ item.upbjj }}</td><td>{{ item.lokasiRak }}</td>
              <td class="nowrap">{{ item.harga | rupiah }}</td>
              <td class="nowrap">{{ item.qty | buah }}</td>
              <td class="nowrap">{{ item.safety | buah }}</td>
              <td><status-badge :qty="item.qty" :safety="item.safety" :catatan-html="item.catatanHTML"></status-badge></td>
              <td class="nowrap">
                <button type="button" class="small-btn" :aria-label="'Edit ' + item.kode" @click="editItem(item)">Edit</button>
                <button type="button" class="small-btn danger-text" :aria-label="'Hapus ' + item.kode" @click="confirmDelete(item)">Hapus</button>
              </td>
            </tr>
            <tr v-if="filteredItems.length === 0"><td colspan="9" class="empty-state">Tidak ada bahan ajar yang sesuai filter.</td></tr>
          </tbody>
        </table>
      </div>
      <p class="hint">Hover atau fokus pada status untuk melihat isi field catatanHTML dari JSON.</p>
    </div>

    <div v-if="showEditor" class="panel editor" id="stock-editor">
      <div class="section-heading"><h3>{{ editingCode ? 'Edit Bahan Ajar' : 'Tambah Bahan Ajar Baru' }}</h3>
        <button type="button" class="text-btn" @click="closeEditor">Tutup</button>
      </div>
      <form @submit.prevent="saveItem" @keydown.enter.prevent="saveItem">
        <div class="form-grid">
          <label>Kode mata kuliah *<input ref="codeInput" v-model.trim="form.kode" type="text" :disabled="!!editingCode" placeholder="Contoh: STSI4209"></label>
          <label>Judul mata kuliah *<input ref="titleInput" v-model.trim="form.judul" type="text" placeholder="Nama bahan ajar"></label>
          <label>Kategori *
            <select v-model="form.kategori"><option value="">Pilih kategori</option><option v-for="cat in kategoriList" :key="cat" :value="cat">{{ cat }}</option></select>
          </label>
          <label>UT-Daerah *
            <select v-model="form.upbjj"><option value="">Pilih daerah</option><option v-for="u in upbjjList" :key="u" :value="u">{{ u }}</option></select>
          </label>
          <label>Lokasi rak *<input v-model.trim="form.lokasiRak" type="text" placeholder="Contoh: R1-A3"></label>
          <label>Harga (Rp) *<input v-model.number="form.harga" type="number" min="0" step="1"></label>
          <label>Qty (buah) *<input v-model.number="form.qty" type="number" min="0" step="1"></label>
          <label>Safety stock (buah) *<input v-model.number="form.safety" type="number" min="0" step="1"></label>
          <label class="full-width">Catatan HTML (opsional)<input v-model="form.catatanHTML" type="text" placeholder="Misalnya: &lt;em&gt;Edisi baru&lt;/em&gt;"></label>
        </div>
        <p v-if="formError" class="form-error" role="alert" v-text="formError"></p>
        <div class="actions"><button type="submit" class="btn btn-primary">Simpan (atau Enter)</button>
          <button type="button" class="btn btn-ghost" @click="closeEditor">Batal</button></div>
      </form>
    </div>

    <app-modal :open="!!pendingDelete" title="Konfirmasi Hapus Bahan Ajar"
      :message="pendingDelete ? 'Hapus ' + pendingDelete.kode + ' - ' + pendingDelete.judul + '? Tindakan ini tidak dapat dibatalkan.' : ''"
      @cancel="pendingDelete = null" @confirm="performDelete"></app-modal>
  </div>
</script>
